[package]
name = "bee-cockpit-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Shared cockpit logic for bee-tui and beegui — Bee API client wrappers, polling hub, snapshot types, and pure view computations. Renderer-agnostic."
authors = ["Calin Martinconi <martinconic@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ethswarm-tools/bee-cockpit-core"
readme = "README.md"
keywords = ["swarm", "bee", "ethereum", "cockpit"]
categories = ["api-bindings"]

[dependencies]
bee-rs = "1.6"
color-eyre = "0.6.3"
directories = "5.0.1"
futures = "0.3.31"
num-bigint = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0.211", features = ["derive"] }
serde_json = "1.0.132"
tokio = { version = "1.40.0", features = ["full"] }
tokio-util = "0.7.12"
toml = "0.8"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "serde"] }

[dev-dependencies]
pretty_assertions = "1.4.1"
tempfile = "3.10"

[lib]
path = "src/lib.rs"
